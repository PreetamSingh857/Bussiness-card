<!DOCTYPE html>
<html>
    <head>
        <title>MY card</title>
        <style>
            .image{
                width: 150px;
                border-radius: 5px;
            }
            .card{
                padding: 20px;
                display: flex;
                justify-content: space-around;
                width: 400px;
                margin: auto;
                text-align: center;
                background-color: #faedcd;
                border-bottom: 10px solid #99582a;
                color: #99582a;
            }
            body{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img class="image" src="images/bmw.jpg" alt="The google logo">
            <div>
                <h3>BMW</h3>
                <p>Latest Model</p>
                <h4>Panchkula</h4>
            </div>
        </div>
    </body>
</html>
